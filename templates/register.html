{% extends "layout.html" %}
{% block title %}
   Register
{% endblock %}
{% block main %}
   <form action = "{{ url_for('register') }}" method = "post">
    <div class = "mb-3">
        <input autocomplete = "off" autofocus class = "form-control mx-auto w-auto" name = "email" placeholder = "Email" type = "email">
    </div>
    <div class = "mb-3">
        <input class = "form-control mx-auto w-auto" name = "password" placeholder = "Password" type = "password">
    </div>
    <div class = "mb-3">
        <input class = "form-control mx-auto w-auto" name = "confirmation" placeholder = "Confirm Password" type = "password">
    </div>
    <button class = "btn btn-primary" type = "submit">Register</button><br><br>
    <p>Already have an account? Click <a href="https://amirtak0685-bookish-broccoli-jwr7qqp57q7hqw65-5000.app.github.dev/login">here</a> to login</p>
   </form>
{% endblock %}
