{% extends "layout.html" %}

{% block title %}

{% endblock %}

{% block main %}

        <div class="mb-3">
            <input autocomplete="off" autofocus class="form-control mx-auto w-auto" id="username" name="username" placeholder="Username" type="email">
        </div>
        <div class="mb-3">
            <input class="form-control mx-auto w-auto" id="password" name="password" placeholder="Password" type="password">
        </div>
        <button class="btn btn-primary" type="submit">Log In</button><br><br>
        <p>New to the platform? Click <a href="https://amirtak0685-bookish-broccoli-jwr7qqp57q7hqw65-5000.app.github.dev/register">here</a> to register</a></p>
    </form>
{% endblock %}
